<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route 66 App Reset</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#f7fbff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{max-width:720px;padding:28px;border:1px solid rgba(142,244,255,.2);border-radius:24px;background:rgba(255,255,255,.06)}button,a{display:inline-block;margin:8px 8px 0 0;padding:12px 16px;border-radius:999px;border:0;background:#1a73e8;color:#fff;font-weight:800;text-decoration:none}pre{white-space:pre-wrap;color:#8ef4ff}</style>
</head>
<body>
<main>
<h1>App-Reset</h1>
<p>Diese Seite entfernt alte Service Worker und Caches. Danach wird die App frisch online geladen.</p>
<button onclick="resetApp()">Jetzt resetten</button>
<a href="./?fresh=v6">App frisch öffnen</a>
<pre id="log">Bereit.</pre>
</main>
<script>
async function resetApp(){
  const log = document.getElementById('log');
  const lines = [];
  function add(t){ lines.push(t); log.textContent = lines.join('\n'); }
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      add('Service Worker gefunden: ' + regs.length);
      for (const reg of regs) await reg.unregister();
      add('Service Worker entfernt.');
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      add('Caches gefunden: ' + keys.length);
      for (const key of keys) await caches.delete(key);
      add('Caches gelöscht.');
    }
    add('Fertig. Öffne jetzt die App frisch.');
    setTimeout(() => location.href = './?fresh=v6-' + Date.now(), 900);
  } catch(e) {
    add('Fehler: ' + e.message);
  }
}
</script>
</body>
</html>
