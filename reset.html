<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route 66 Reset</title><style>body{font-family:system-ui;background:#070b12;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:620px;padding:28px;border:1px solid #28465a;border-radius:24px;background:#111927;box-shadow:0 30px 90px rgba(0,0,0,.45)}button,a{display:inline-block;margin-top:12px;border:0;border-radius:999px;background:#1a73e8;color:#fff;padding:12px 16px;text-decoration:none;font-weight:900}p{color:#cbd5e1}</style></head>
<body><main><h1>App-Cache zurücksetzen</h1><p>Entfernt alte Service Worker und Caches. Danach wird v16 frisch geladen.</p><button onclick="resetApp()">Jetzt resetten</button><p id="out"></p><a href="./index.html?v=16">Zur App</a></main><script>
async function resetApp(){const out=document.getElementById('out');out.textContent='Reset läuft …';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}localStorage.clear();sessionStorage.clear();out.textContent='Fertig. App wird frisch geladen …';setTimeout(()=>location.href='./index.html?v=16&fresh='+Date.now(),500);}catch(e){out.textContent='Reset-Fehler: '+e.message;}}
</script></body></html>
