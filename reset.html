<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Route 66 App</title>
<style>body{font-family:system-ui;background:#070b12;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:560px;padding:28px;border:1px solid #28465a;border-radius:24px;background:#111927}button,a{display:inline-block;margin-top:12px;border:0;border-radius:999px;background:#1a73e8;color:#fff;padding:12px 16px;text-decoration:none;font-weight:800}</style></head>
<body><main><h1>App-Cache zurücksetzen</h1><p>Entfernt alte Service Worker und Caches, danach wird die aktuelle v10 geladen.</p><button onclick="reset()">Jetzt resetten</button><p id="out"></p><a href="./index.html?v=10">Zur App</a></main>
<script>
async function reset(){
  const out=document.getElementById('out');
  out.textContent='Reset läuft …';
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
  }
  out.textContent='Fertig. App wird frisch geladen …';
  location.href='./index.html?v=10&fresh=' + Date.now();
}
</script></body></html>
