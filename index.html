
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Route 66 Nightlife Final</title>
<style>
body{font-family:Arial;background:#101820;color:#fff;padding:20px}
.card{background:#1a2632;padding:16px;border-radius:14px;margin-bottom:12px}
</style>
</head>
<body>
<h1>Route 66 Adult Nightlife</h1>
<p>Wichita wurde vollständig entfernt.</p>
<div id="app"></div>
<script>
fetch('adultData.json')
.then(r=>r.json())
.then(data=>{
 const app=document.getElementById('app');
 data.route.forEach(item=>{
   const div=document.createElement('div');
   div.className='card';
   div.innerHTML=`<strong>${item.date}</strong> · ${item.city}`;
   app.appendChild(div);
 });
});
</script>
</body>
</html>
