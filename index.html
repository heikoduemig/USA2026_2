<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route 66 After Dark PRO</title>
<meta name="description" content="Mobile- und Desktop-optimierter Route 66 Nightlife Companion mit Google Maps, Places, PWA, Tonight Picks und Offline Cache.">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://maps.googleapis.com">
<link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=pro5">
</head>
<body>
<section class="hero" aria-labelledby="app-title">
  <div class="logo">✦ Route 66 After Dark PRO</div>
  <h1 id="app-title">Nightlife Companion</h1>
  <p class="subtitle">Kompakter Route-66-Nightlife-Planer mit Karte, Tagesauswahl, Kategorien, Tonight Picks und schnellen Links für Maps, Uber, Wetter und Late-Night-Food.</p>
  <div class="tools">
    <button type="button" onclick="toggleMode()" aria-label="Darstellung zwischen Light und Dark Neon wechseln">Light / Dark Neon</button>
    <button type="button" onclick="nearMe()">Near me tonight</button>
    <button type="button" onclick="fitAll()">Alle Ziele</button>
    <button type="button" onclick="clearAppCache()">Cache aktualisieren</button>
  </div>
  <div class="grid">
    <div class="glass panel">
      <h2>Übersicht</h2>
      <div id="picks"></div>
      <div class="status" id="status" role="status" aria-live="polite">App wird geladen…</div>
    </div>
    <div class="glass panel" id="karte">
      <div class="panel-head"><h2>Google Map</h2><span id="map-count">Filterbare Spots</span></div>
      <div id="map" role="application" aria-label="Interaktive Google Karte mit Nightlife-Zielen"></div>
      <div class="map-controls" aria-label="Kartenfilter und Stadtfokus">
        <button type="button" onclick="focusCity('Chicago')">Chicago</button>
        <button type="button" onclick="focusCity('St. Louis')">St. Louis</button>
        <button type="button" onclick="focusCity('Tulsa')">Tulsa</button>
        <button type="button" onclick="focusCity('Lawton')">Lawton</button>
        <button type="button" onclick="focusCity('Austin')">Austin</button>
        <button type="button" data-map-filter="day">Heute</button>
        <button type="button" data-map-filter="top">Pflichtmarker</button>
        <button type="button" data-map-filter="rated">4.2+</button>
        <button type="button" data-map-filter="tabledance">Tabledance</button>
        <button type="button" data-map-filter="nude">Nude</button>
        <button type="button" data-map-filter="cabaret">Cabaret</button>
        <button type="button" data-map-filter="all" class="active">Alle</button>
      </div>
    </div>
  </div>
</section>

<nav class="tabs" id="tabs" aria-label="Reisetage"></nav>
<main id="days" tabindex="-1"></main>

<nav class="bottom" aria-label="Schnellnavigation">
  <a href="#karte">Map</a>
  <a href="#days">Tage</a>
  <a href="#austin">Austin</a>
  <a href="#chicago">Chicago</a>
</nav>

<script src="adultData.js?v=pro5"></script>
<script src="app.js?v=pro5"></script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8644C1bG05JivRoEANWGzN4Tir4tnLvY&libraries=places&callback=initMap"></script>
</body>
</html>
