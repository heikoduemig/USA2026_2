<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route 66 After Dark PRO</title>
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=pro10">
</head>
<body>
<header class="hero">
  <div class="logo">✦ Route 66 After Dark PRO</div>
  <h1>Nightlife Companion</h1>
  <p class="subtitle">Dark-Neon Übersicht nach Städten mit heller Google Map, direkten Stadtlinks und Website-/Google-Maps-Buttons.</p>

  <div class="topbar">
    <button class="primary" onclick="nearMe()">Near me tonight</button>
    <nav class="city-links" aria-label="Städte">
      <a href="#chicago">Chicago</a>
      <a href="#st-louis">St. Louis</a>
      <a href="#tulsa">Tulsa</a>
      <a href="#lawton">Lawton</a>
      <a href="#austin">Austin</a>
    </nav>
  </div>

  <section class="glass map-panel" id="karte">
    <div class="map-head">
      <div>
        <div class="eyebrow">Helle Google Map</div>
        <h2>Locations nach Stadt</h2>
      </div>
      <div class="map-controls">
        <button onclick="focusCity('Chicago')">Chicago</button>
        <button onclick="focusCity('St. Louis')">St. Louis</button>
        <button onclick="focusCity('Tulsa')">Tulsa</button>
        <button onclick="focusCity('Lawton')">Lawton</button>
        <button onclick="focusCity('Austin')">Austin</button>
        <button onclick="fitAll()">Alle</button>
      </div>
    </div>
    <div id="map"></div>
    <div class="status" id="status">App wird geladen…</div>
  </section>
</header>

<main id="cities"></main>

<nav class="bottom" aria-label="Schnellnavigation">
  <a href="#karte">Map</a>
  <a href="#chicago">Chicago</a>
  <a href="#st-louis">St. Louis</a>
  <a href="#austin">Austin</a>
</nav>

<script src="adultData.js?v=pro10"></script>
<script src="app.js?v=pro10"></script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA8644C1bG05JivRoEANWGzN4Tir4tnLvY&libraries=places&callback=initMap"></script>
</body>
</html>
